<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="stylesheet" href="./css/stylesheet.css">
</head>
<body>
    <div class="startscreen">
        <div class="overlay"></div> 

    <div class="backshadow">

    <div class="menu-grid">

        <div class="highscore">
            <div class="value" id="highscore">0</div>
            <div class="label">Highscore</div>
            
        </div>

        <div class="lastscore">
            <div class="value" id="lastScore">0</div>
            <div class="label">Latest Score</div>
            
        </div>

        <button onclick="gameStart()" class="buttons play">
            Play
        </button>

    </div>

</div>
</div>


    <!-- Spiel -->
    <div class="gamescreen" id="gamescreen">
         <canvas id="game" width="800" height="800"></canvas>
    </div>
    <script src="./js/snake.js"></script>

</body>
</html>
